# Databricks Asset Bundle (Declarative Automation Bundles) do SAT no BB.
# Config NAO secreta vive aqui (fonte de verdade); segredos no secret scope.
# Compute por TARGET: dev = serverless (Free Edition); bb_dev/bb_prd = classico (BB).
# Deploy: bundle deploy -t bb_dev -p <perfil-dev-bb>  /  -t bb_prd -p <perfil-prd-bb>
bundle:
  name: SAT

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**
    - configs/**
    - dashboards/**
    - app/**
    - lib/**
  exclude:            # docs de projeto nao vao ao workspace do cliente
    - README.md
    - CONTRIBUTING.md

variables:
  catalog:
    description: Catalogo Unity Catalog do SAT neste ambiente.
  analysis_schema:
    description: Schema do SAT dentro do catalogo.
    default: analysis_schema
  # Compute (usadas so no target classico/prd)
  run_as_sp:
    default: ""
  spark_version:
    default: ""
  node_type_id:
    default: ""
  num_workers:
    default: 5
  # Flags de execucao (nao secretas), parametrizadas por ambiente
  use_parallel_runs:
    default: "true"
  maxpages:
    default: "100"
  timebetweencalls:
    default: "1"
  secrets_max_parallel_workspaces:
    default: "4"
  driver_schedule:
    default: "0 0 8 ? * Mon,Wed,Fri"
  secrets_scanner_schedule:
    default: "0 0 10 ? * *"
  job_timezone:
    default: "America/Sao_Paulo"

targets:
  # ---------------- DEV pessoal: serverless (Free Edition) ----------------
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-242e0db0-bd12.cloud.databricks.com
    variables:
      catalog: usd_dsv
      analysis_schema: analysis_schema
    resources:
      jobs:
        sat_initializer:
          tasks:
            - task_key: "sat_initializer"
              environment_key: "default"
          environments:
            - environment_key: "default"
              spec:
                client: "5"
        sat_driver:
          tasks:
            - task_key: "sat_driver"
              environment_key: "default"
          environments:
            - environment_key: "default"
              spec:
                client: "5"
        sat_secrets:
          tasks:
            - task_key: "secrets_scanner"
              environment_key: "default"
          environments:
            - environment_key: "default"
              spec:
                client: "5"

  # ---------------- BB DEV: classico (workspace de dev do BB) ----------------
  bb_dev:
    mode: production
    presets:
      trigger_pause_status: PAUSED   # dispara manual no dev; sem prefixo canary (vai substituir o SAT de dev)
    workspace:
      host: https://adb-7405614144903883.3.azuredatabricks.net
      root_path: /Applications/${bundle.name}
    run_as:
      service_principal_name: ${var.run_as_sp}
    variables:
      catalog: usd_des                # catalogo do DEV do BB
      analysis_schema: analysis_schema
      run_as_sp: "40df3399-4034-4690-8d17-a67031821dc2"   # SP do dev do BB
      spark_version: "16.4.x-scala2.12"
      node_type_id: "Standard_DS4_v2"
      num_workers: 3
    resources:
      jobs:
        sat_initializer:
          tasks:
            - task_key: "sat_initializer"
              job_cluster_key: job_cluster
          job_clusters:
            - job_cluster_key: job_cluster
              new_cluster: &classic_cluster
                data_security_mode: SINGLE_USER
                num_workers: ${var.num_workers}
                spark_version: ${var.spark_version}
                runtime_engine: PHOTON
                node_type_id: ${var.node_type_id}
                azure_attributes:
                  first_on_demand: 1
                  availability: ON_DEMAND_AZURE
                  spot_bid_max_price: -1
                spark_env_vars:
                  PYSPARK_PYTHON: /databricks/python3/bin/python3
                enable_elastic_disk: true
        sat_driver:
          tasks:
            - task_key: "sat_driver"
              job_cluster_key: job_cluster
          job_clusters:
            - job_cluster_key: job_cluster
              new_cluster: *classic_cluster
        sat_secrets:
          tasks:
            - task_key: "secrets_scanner"
              job_cluster_key: job_cluster
          job_clusters:
            - job_cluster_key: job_cluster
              new_cluster: *classic_cluster

  # ---------------- BB PRD: classico (workspace de prd do BB) ----------------
  bb_prd:
    mode: production
    presets:
      name_prefix: "[canary] "      # paralelo ao SAT atual do BB
      trigger_pause_status: PAUSED
    workspace:
      host: https://adb-5248734954947264.4.azuredatabricks.net
      root_path: /Applications/sat_canary
    run_as:
      service_principal_name: ${var.run_as_sp}
    variables:
      catalog: usd_prd
      analysis_schema: analysis_canary   # schema proprio do canary (nao toca o SAT atual)
      run_as_sp: "1eff7c5e-75cd-47c6-accf-febf25889c70"   # SP de prd do BB
      spark_version: "16.4.x-scala2.12"
      node_type_id: "Standard_DS4_v2"
      num_workers: 3
    resources:
      jobs:
        sat_initializer:
          tasks:
            - task_key: "sat_initializer"
              job_cluster_key: job_cluster
          job_clusters:
            - job_cluster_key: job_cluster
              new_cluster: *classic_cluster
        sat_driver:
          tasks:
            - task_key: "sat_driver"
              job_cluster_key: job_cluster
          job_clusters:
            - job_cluster_key: job_cluster
              new_cluster: *classic_cluster
        sat_secrets:
          tasks:
            - task_key: "secrets_scanner"
              job_cluster_key: job_cluster
          job_clusters:
            - job_cluster_key: job_cluster
              new_cluster: *classic_cluster
