# Databricks Asset Bundle (Declarative Automation Bundles) do SAT no BB.
# Config NAO secreta vive aqui (fonte de verdade); segredos no secret scope.
# Compute e definido por TARGET: dev = serverless (Free Edition), prd = classico (BB).
# Deploy: databricks bundle deploy -t dev -p pessoal   /   -t prd -p <profile-bb>
bundle:
  name: sat-canary

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**
    - configs/**
    - dashboards/**
    - app/**
    - lib/**

variables:
  catalog:
    description: Catalogo Unity Catalog do SAT neste ambiente.
  analysis_schema:
    description: Schema do SAT dentro do catalogo.
    default: analysis_schema
  # Compute (usadas so no target classico/prd)
  run_as_sp:
    default: ""
  spark_version:
    default: ""
  node_type_id:
    default: ""
  num_workers:
    default: 5
  # Flags de execucao (nao secretas), parametrizadas por ambiente
  use_parallel_runs:
    default: "true"
  maxpages:
    default: "100"
  timebetweencalls:
    default: "1"
  secrets_max_parallel_workspaces:
    default: "4"
  driver_schedule:
    default: "0 0 8 ? * Mon,Wed,Fri"
  secrets_scanner_schedule:
    default: "0 0 10 ? * *"
  job_timezone:
    default: "America/Sao_Paulo"

targets:
  # ---------------- DEV: serverless (Free Edition) ----------------
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-242e0db0-bd12.cloud.databricks.com
    variables:
      catalog: usd_dsv
      analysis_schema: analysis_schema
    resources:
      jobs:
        sat_initializer:
          tasks:
            - task_key: "sat_initializer"
              environment_key: "default"
          environments:
            - environment_key: "default"
              spec:
                client: "5"
        sat_driver:
          tasks:
            - task_key: "sat_driver"
              environment_key: "default"
          environments:
            - environment_key: "default"
              spec:
                client: "5"
        sat_secrets:
          tasks:
            - task_key: "secrets_scanner"
              environment_key: "default"
          environments:
            - environment_key: "default"
              spec:
                client: "5"

  # ---------------- PRD: classico (BB, Azure) ----------------
  prd:
    mode: production
    presets:
      name_prefix: "[canary] "     # separa visualmente do SAT atual do BB
      trigger_pause_status: PAUSED  # canary sobe com schedules pausados
    workspace:
      host: https://adb-5248734954947264.4.azuredatabricks.net   # PRD (do sat.log)
      root_path: /Applications/${bundle.name}
    run_as:
      service_principal_name: ${var.run_as_sp}
    variables:
      catalog: usd_prd                # PRD (sat.log mostra usd_prd — confirmar)
      analysis_schema: analysis_canary   # schema proprio do canary (tabelas novas, vazias)
      run_as_sp: "1eff7c5e-75cd-47c6-accf-febf25889c70"   # SP do BB (excecao: id nao-secreto, repo interno)
      spark_version: "16.4.x-scala2.12"   # do job real do BB (LTS Photon)
      node_type_id: "Standard_DS4_v2"      # do job real do BB
      num_workers: 3                  # paridade com o job atual do BB
    resources:
      jobs:
        sat_initializer:
          tasks:
            - task_key: "sat_initializer"
              job_cluster_key: job_cluster
              libraries:
                - whl: ./lib/dbl_sat_sdk-0.1.51-py3-none-any.whl
          job_clusters:
            - job_cluster_key: job_cluster
              new_cluster:
                data_security_mode: SINGLE_USER
                num_workers: ${var.num_workers}
                spark_version: ${var.spark_version}
                runtime_engine: PHOTON
                node_type_id: ${var.node_type_id}
                azure_attributes:
                  first_on_demand: 1
                  availability: ON_DEMAND_AZURE
                  spot_bid_max_price: -1
                spark_env_vars:
                  PYSPARK_PYTHON: /databricks/python3/bin/python3
                enable_elastic_disk: true
        sat_driver:
          tasks:
            - task_key: "sat_driver"
              job_cluster_key: job_cluster
              libraries:
                - whl: ./lib/dbl_sat_sdk-0.1.51-py3-none-any.whl
          job_clusters:
            - job_cluster_key: job_cluster
              new_cluster:
                data_security_mode: SINGLE_USER
                num_workers: ${var.num_workers}
                spark_version: ${var.spark_version}
                runtime_engine: PHOTON
                node_type_id: ${var.node_type_id}
                azure_attributes:
                  first_on_demand: 1
                  availability: ON_DEMAND_AZURE
                  spot_bid_max_price: -1
                spark_env_vars:
                  PYSPARK_PYTHON: /databricks/python3/bin/python3
                enable_elastic_disk: true
        sat_secrets:
          tasks:
            - task_key: "secrets_scanner"
              job_cluster_key: job_cluster
              libraries:
                - whl: ./lib/dbl_sat_sdk-0.1.51-py3-none-any.whl
          job_clusters:
            - job_cluster_key: job_cluster
              new_cluster:
                data_security_mode: SINGLE_USER
                num_workers: ${var.num_workers}
                spark_version: ${var.spark_version}
                runtime_engine: PHOTON
                node_type_id: ${var.node_type_id}
                azure_attributes:
                  first_on_demand: 1
                  availability: ON_DEMAND_AZURE
                  spot_bid_max_price: -1
                spark_env_vars:
                  PYSPARK_PYTHON: /databricks/python3/bin/python3
                enable_elastic_disk: true
