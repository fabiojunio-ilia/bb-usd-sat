# TruffleHog Custom Detectors Configuration
# This file contains custom detector definitions for TruffleHog secret scanning
# Used by the SAT (Security Analysis Tool) TruffleHog integration
#
# Detectors live under the top-level `detectors:` key. Each item's keys
# (name, description, keywords, regex) must align at the same indentation.
# To add your OWN detectors without editing this shipped file, create
# `custom_trufflehog_detectors.yaml` in this same configs/ directory — SAT
# merges its `detectors:` into the list below (custom wins on name clash).

detectors:
  - name: DapiToken
    description: "Databricks DAPI token detector"
    keywords:
      - dapi
    regex:
      id: '(?i)\b(dapi[a-h0-9]{32})'

  - name: DkeaToken
    description: "Databricks DKEA token detector"
    keywords:
      - dkea
    regex:
      id: '(?i)\b(dkea[a-h0-9]{32})'

  - name: DsapiToken
    description: "Databricks Scoped API Token detector"
    keywords:
      - dsapi
    regex:
      id: '(?i)\b(dsapi[a-h0-9]{32})'

  - name: DoseToken
    description: "Databricks DOSE token detector"
    keywords:
      - dose
    regex:
      id: '(?i)\b(dose[a-h0-9]{32})'

# Configuration settings for TruffleHog scanning
settings:
  excluded_detectors:
    - DatabricksToken  # Exclude built-in Databricks token detector to avoid false positives

  scan_options:
    no_update: true
    json_output: true

  rate_limiting:
    api_sleep_seconds: 10  # Backoff base (seconds) used only when the API returns
                           # HTTP 429. There is no unconditional inter-call sleep.

  performance:
    max_workers: 16  # Threads for I/O-bound work (workspace/list, get-status,
                     # notebook export/FUSE copy). I/O-bound, so > core count is fine.

  file_paths:
    temp_config: "/tmp/trufflehog_config.yaml"
    temp_notebooks: "/tmp/notebooks"
    results_log: "/tmp/trufflehog_scan_results.json"
    scan_batch_dir: "/tmp/notebook_scan_batch"  # Dir where a chunk of notebooks is
                                                # materialized for a single TruffleHog pass

  completeness:
    # Execucao parcial vira registro em scan_discovery_stats.status, nao falha do
    # job. Reprovar em cima de excecao ja conhecida vira ruido, e alarme ruidoso
    # e alarme desligado. A leitura fica em v_secret_scan_completude.
    fail_on_incomplete_scan: false
    # Perda de evidencia e outra coisa: o segredo foi encontrado e o registro se
    # perdeu. Nenhuma tratativa cobre isso, entao continua reprovando.
    fail_on_lost_findings: true

  search_settings:
    page_size: 50
    days_back: 1  # Janela da descoberta, em dias. 1 = incremental diario (so o que
                  # mudou desde a meia-noite UTC de ontem). 0 = varredura completa do
                  # acervo, sem filtro de tempo: volume e duracao sobem em ordens de
                  # grandeza e o job tem timeout de 8h. Voltar para 1 apos a varredura.
                  # Set to 0 to scan ALL notebooks (no time filter)
                  # Can be overridden by TIME environment variable (epoch milliseconds)
