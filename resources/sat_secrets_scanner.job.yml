resources:
  jobs:
    sat_secrets:
      name: "SAT Secrets Scanner"
      timeout_seconds: 28800
      tags:
        Application: SAT
      schedule:
        quartz_cron_expression: ${var.secrets_scanner_schedule}
        timezone_id: ${var.job_timezone}
      tasks:
        - task_key: "secrets_scanner"
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/security_analysis_secrets_scanner
            base_parameters:
              analysis_schema_name: "${var.catalog}.${var.analysis_schema}"
              maxpages: "${var.maxpages}"
              timebetweencalls: "${var.timebetweencalls}"
              use_parallel_runs: "${var.use_parallel_runs}"
              secrets_max_parallel_workspaces: "${var.secrets_max_parallel_workspaces}"
