# This is a Databricks asset bundle definition for bb_usd_sat.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bb_usd_sat
  uuid: 88664011-af38-475a-a99d-3ac62b068251

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-242e0db0-bd12.cloud.databricks.com
    variables:
      catalog: usd_dsv
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-242e0db0-bd12.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/fabio.m.t.j97@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/fabio.m.t.j97@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: usd_dsv
      schema: prod
    permissions:
      - user_name: fabio.m.t.j97@gmail.com
        level: CAN_MANAGE
