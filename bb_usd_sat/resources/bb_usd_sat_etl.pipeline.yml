# The main pipeline for bb_usd_sat

resources:
  pipelines:
    bb_usd_sat_etl:
      name: bb_usd_sat_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/bb_usd_sat_etl"

      libraries:
        - glob:
            include: ../src/bb_usd_sat_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
